name: Build kext

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild -project RTL812xLucy.xcodeproj -target RTL812xLucy -configuration Release \
            -arch x86_64 build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Package
        run: |
          cd build/Release
          zip -r "$GITHUB_WORKSPACE/RTL812xLucy-diag.kext.zip" RTL812xLucy.kext
      - uses: actions/upload-artifact@v4
        with:
          name: RTL812xLucy-diag
          path: RTL812xLucy-diag.kext.zip
